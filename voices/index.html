<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>群英声场 · 武将语音试听</title><style>
*{box-sizing:border-box}body{margin:0;background:#17231f;color:#eee6d6;font-family:system-ui,"PingFang SC",sans-serif}main{max-width:1000px;margin:auto;padding:40px 20px}a{color:#ddbd7d}h1{font-family:serif;font-size:36px;margin:8px 0}p{color:#c2bbaa;line-height:1.7}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:#24312b;padding:18px;border:1px solid #56604e;border-radius:12px}.controls label{display:flex;gap:10px;align-items:center}select,button{font:inherit}select{background:#eee6d6;color:#17231f;border:0;padding:9px;border-radius:6px}button{cursor:pointer;border:1px solid #596651;border-radius:10px;color:inherit;background:#27372e;padding:16px;text-align:left}button:hover,button:focus-visible{outline:2px solid #ddbd7d;outline-offset:2px}button.active{background:#614332;border-color:#e4bd78}button strong{display:block;font-size:22px;margin:5px 0}button small{color:#cbc2af}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}#stop{padding:9px 14px}#status{min-height:2em;color:#e4bd78}input{accent-color:#d4a55f}@media(max-width:600px){main{padding:20px 14px}.grid{grid-template-columns:repeat(2,1fr)}h1{font-size:30px}}
</style></head><body><main><a href="../">← 返回游戏</a><p>三国杀 · 一局风云</p><h1>群英声场</h1><p>选择牌名，点击武将试听。张飞采用狂野版声线。</p><div class="controls"><label>试听卡牌 <select id="card"><option value="jiu">酒</option><option value="wuxie">无懈可击</option><option value="sha">杀</option><option value="shan">闪</option><option value="tao">桃</option><option value="wuzhong">无中生有</option><option value="guohe">过河拆桥</option><option value="shunshou">顺手牵羊</option><option value="juedou">决斗</option><option value="nanman">南蛮入侵</option><option value="wanjian">万箭齐发</option><option value="taoyuan">桃园结义</option><option value="huogong">火攻</option><option value="tiesuo">铁索连环</option><option value="wugu">五谷丰登</option><option value="lebu">乐不思蜀</option><option value="shandian">闪电</option><option value="liannu">诸葛连弩</option><option value="qinglong">青龙偃月刀</option><option value="hanbing">寒冰剑</option><option value="fangtian">方天画戟</option><option value="bagua">八卦阵</option><option value="tengjia">藤甲</option><option value="chitu">赤兔</option><option value="dilu">的卢</option></select></label><label>试听音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.6"></label><button id="stop">停止播放</button></div><p id="status" role="status" aria-live="polite">点击任意武将，开始试听</p><section class="grid"><button data-general="liubei" data-name="刘备" aria-label="试听刘备"><small>蜀 · 乱世的枭雄</small><strong>刘备</strong><span>▶ 试听</span></button><button data-general="caocao" data-name="曹操" aria-label="试听曹操"><small>魏 · 魏武的霸业</small><strong>曹操</strong><span>▶ 试听</span></button><button data-general="sunquan" data-name="孙权" aria-label="试听孙权"><small>吴 · 江东的碧眼儿</small><strong>孙权</strong><span>▶ 试听</span></button><button data-general="guanyu" data-name="关羽" aria-label="试听关羽"><small>蜀 · 美髯公</small><strong>关羽</strong><span>▶ 试听</span></button><button data-general="zhaoyun" data-name="赵云" aria-label="试听赵云"><small>蜀 · 少年将军</small><strong>赵云</strong><span>▶ 试听</span></button><button data-general="diaochan" data-name="貂蝉" aria-label="试听貂蝉"><small>群 · 绝世的舞姬</small><strong>貂蝉</strong><span>▶ 试听</span></button><button data-general="zhugeliang" data-name="诸葛亮" aria-label="试听诸葛亮"><small>蜀 · 卧龙的神算</small><strong>诸葛亮</strong><span>▶ 试听</span></button><button data-general="zhangliao" data-name="张辽" aria-label="试听张辽"><small>魏 · 威震逍遥津</small><strong>张辽</strong><span>▶ 试听</span></button><button data-general="huangzhong" data-name="黄忠" aria-label="试听黄忠"><small>蜀 · 老当益壮</small><strong>黄忠</strong><span>▶ 试听</span></button><button data-general="machao" data-name="马超" aria-label="试听马超"><small>蜀 · 西凉的铁骑</small><strong>马超</strong><span>▶ 试听</span></button><button data-general="mouchengyu" data-name="程昱" aria-label="试听程昱"><small>魏 · 泰山捧日</small><strong>程昱</strong><span>▶ 试听</span></button><button data-general="mousunjian" data-name="孙坚" aria-label="试听孙坚"><small>吴 · 江东猛虎</small><strong>孙坚</strong><span>▶ 试听</span></button><button data-general="zhangfei" data-name="张飞" aria-label="试听张飞"><small>蜀 · 万夫不当</small><strong>张飞</strong><span>▶ 试听</span></button><button data-general="zhenji" data-name="甄姬" aria-label="试听甄姬"><small>魏 · 洛水清影</small><strong>甄姬</strong><span>▶ 试听</span></button><button data-general="huangyueying" data-name="黄月英" aria-label="试听黄月英"><small>蜀 · 灵慧巧思</small><strong>黄月英</strong><span>▶ 试听</span></button><button data-general="zhouyu" data-name="周瑜" aria-label="试听周瑜"><small>吴 · 江东美周郎</small><strong>周瑜</strong><span>▶ 试听</span></button><button data-general="sunshangxiang" data-name="孙尚香" aria-label="试听孙尚香"><small>吴 · 弓腰姬</small><strong>孙尚香</strong><span>▶ 试听</span></button><button data-general="xuchu" data-name="许褚" aria-label="试听许褚"><small>魏 · 虎痴</small><strong>许褚</strong><span>▶ 试听</span></button><button data-general="huatuo" data-name="华佗" aria-label="试听华佗"><small>群 · 神医济世</small><strong>华佗</strong><span>▶ 试听</span></button><button data-general="yanliangwenchou" data-name="颜良文丑" aria-label="试听颜良文丑"><small>群 · 虎狼兄弟</small><strong>颜良文丑</strong><span>▶ 试听</span></button><button data-general="simayi" data-name="司马懿" aria-label="试听司马懿"><small>魏 · 鹰视狼顾</small><strong>司马懿</strong><span>▶ 试听</span></button><button data-general="xiahoudun" data-name="夏侯惇" aria-label="试听夏侯惇"><small>魏 · 独目苍狼</small><strong>夏侯惇</strong><span>▶ 试听</span></button><button data-general="guojia" data-name="郭嘉" aria-label="试听郭嘉"><small>魏 · 天妒奇才</small><strong>郭嘉</strong><span>▶ 试听</span></button><button data-general="ganning" data-name="甘宁" aria-label="试听甘宁"><small>吴 · 锦帆游侠</small><strong>甘宁</strong><span>▶ 试听</span></button><button data-general="daqiao" data-name="大乔" aria-label="试听大乔"><small>吴 · 国色流芳</small><strong>大乔</strong><span>▶ 试听</span></button><button data-general="lvmeng" data-name="吕蒙" aria-label="试听吕蒙"><small>吴 · 士别三日</small><strong>吕蒙</strong><span>▶ 试听</span></button><button data-general="sunce" data-name="孙策" aria-label="试听孙策"><small>吴 · 江东小霸王</small><strong>孙策</strong><span>▶ 试听</span></button></section></main><script>
const audio=new Audio();let active=null;let serial=0;const status=document.querySelector('#status');
function stop(){serial++;audio.pause();audio.removeAttribute('src');audio.load();active?.classList.remove('active');active=null}
document.querySelector('.grid').addEventListener('click',async event=>{const button=event.target.closest('[data-general]');if(!button)return;stop();const current=serial;active=button;button.classList.add('active');audio.volume=Number(document.querySelector('#volume').value);audio.src='./'+button.dataset.general+'/'+document.querySelector('#card').value+'.mp3';status.textContent='正在加载 '+button.dataset.name;try{await audio.play()}catch{if(serial===current){status.textContent='暂时无法播放，请再试一次';stop()}}});
audio.addEventListener('playing',()=>{if(active)status.textContent='正在播放：'+active.dataset.name+' · '+document.querySelector('#card').selectedOptions[0].textContent});
audio.addEventListener('ended',()=>{status.textContent='试听结束，可以选择其他武将或卡牌';active?.classList.remove('active');active=null});
audio.addEventListener('error',()=>{if(active){status.textContent='音频加载失败，请刷新后重试';stop()}});
document.querySelector('#stop').onclick=()=>{stop();status.textContent='已停止播放'};
document.querySelector('#card').onchange=()=>{stop();status.textContent='点击武将试听所选卡牌'};
document.querySelector('#volume').oninput=event=>{audio.volume=Number(event.target.value)};
document.addEventListener('visibilitychange',()=>{if(document.hidden){stop();status.textContent='已暂停试听'}});
</script></body></html>
